name: Lag release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versjon (f.eks. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Bygg nedlastingspakke
        run: |
          mkdir -p dist/PPTimagePoint
          cp manifest.xml install/LES-MEG.txt install/*.bat install/*.command dist/PPTimagePoint/
          chmod +x dist/PPTimagePoint/*.command
          cd dist && zip -r "PPTimagePoint-${VERSION}.zip" PPTimagePoint
      - name: Opprett release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "dist/PPTimagePoint-${VERSION}.zip" manifest.xml \
            --title "PPTimagePoint $VERSION" \
            --notes-file install/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
